name: Disposable Supabase service tests
# Optional, explicitly invoked service campaign; existing required checks are unchanged.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-services:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:services:guards
      - run: npm run test:services
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-service-evidence-${{ github.run_attempt }}
          path: |
            test-results/local-supabase.json
            test-results/local-supabase-lifecycle.json
          if-no-files-found: error
          retention-days: 14
