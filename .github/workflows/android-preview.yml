name: Android preview APK
on:
  workflow_dispatch:
  push:
    branches: [codex/coach-foundation]
    paths-ignore: ['**/*.md', 'docs/images/**']
permissions:
  contents: write
concurrency:
  group: android-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_APP_ENV: test
      ANDROID_HOME: /tmp/parentplus-sdk
      ANDROID_USER_HOME: /tmp/parentplus-android-user
    steps:
      - uses: actions/checkout@v4
      - name: Record build start
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/github-build-status.cjs')({github, context}, 'running')
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retain Java 17 toolchain location
        run: echo "PARENTPLUS_JAVA17=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: /tmp/parentplus-sdk
          key: parentplus-android-sdk37-0-tools37-ndk27b-v1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: parentplus-gradle94-${{ hashFiles('package-lock.json') }}
          restore-keys: parentplus-gradle94-
      - run: npm ci
      - run: npm run check
      - name: Check actual project settings without creating users or sending emails
        continue-on-error: true
        run: node scripts/check-live-auth.mjs
      - name: Install checksum-verified Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl --fail --location --retry 1 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            printf '%s  %s\n' 'e025545c62a8e64c7559119566a569fb1dec5f60' "$RUNNER_TEMP/android-tools.zip" | sha1sum --check --status
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/sdk-unpack"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/sdk-unpack"
            cp -a "$RUNNER_TEMP/sdk-unpack/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build and verify preview APK
        run: python3 scripts/build-android-preview.py
      - name: Upload installable APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: ParentPlus-Coach-Preview
          path: |
            artifacts/ParentPlus-Coach-Preview.apk
            artifacts/android-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload safe connection/build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-validation
          path: artifacts/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Record final build result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BUILD_STATE: ${{ job.status }}
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        with:
          script: await require('./scripts/github-build-status.cjs')({github, context}, process.env.BUILD_STATE)
