name: App checks
on:
  push:
    branches: [main, codex/coach-foundation, "AM/**", "MM/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: parentplus_workspace_test
          POSTGRES_PASSWORD: fictional-local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d parentplus_workspace_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:workspace:postgres
        env:
          WORKSPACE_TEST_DATABASE_URL: postgres://postgres:fictional-local-test-only@127.0.0.1:5432/parentplus_workspace_test
  parent-attendance-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: parentplus_parent_read_test
          POSTGRES_PASSWORD: fictional-local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d parentplus_parent_read_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:parent:postgres
        env:
          PARENT_READ_TEST_DATABASE_URL: postgres://postgres:fictional-local-test-only@127.0.0.1:5432/parentplus_parent_read_test
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run full build-test-evidence loop
        run: npm run quality:run
      - name: Retain test identities, source-bound receipt and failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-quality-evidence-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
  gate:
    name: ParentPlus required quality gate
    needs: [foundation, workspace-concurrency, parent-attendance-postgres]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both application and real database checks
        env:
          APP_RESULT: ${{ needs.foundation.result }}
          DB_RESULT: ${{ needs.workspace-concurrency.result }}
          PARENT_DB_RESULT: ${{ needs.parent-attendance-postgres.result }}
        run: test "$APP_RESULT" = success && test "$DB_RESULT" = success && test "$PARENT_DB_RESULT" = success
