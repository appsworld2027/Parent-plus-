name: App checks
on:
  push:
    branches: [main, codex/coach-foundation]
    paths-ignore: ['**/*.md', 'docs/images/**']
  pull_request:
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run export:web
      - run: npm run export:android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
