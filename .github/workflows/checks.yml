name: App checks
on:
  push:
    branches: [main, codex/coach-foundation]
    paths-ignore: ['**/*.md', 'docs/images/**']
  pull_request:
jobs:
  workspace-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: parentplus_workspace_test
          POSTGRES_PASSWORD: fictional-local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d parentplus_workspace_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:workspace:postgres
        env:
          WORKSPACE_TEST_DATABASE_URL: postgres://postgres:fictional-local-test-only@127.0.0.1:5432/parentplus_workspace_test
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run export:web
      - run: npm run export:android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
