# Wakes the AppsWorld AI Organization for Parent Plus.
#  - an ai:* label is added           → the named agent works on that issue/PR (agent-worker)
#  - a founder comments /approve etc. → the loop controller acts on it (ai-loop, mode=command)
#  - hourly, or after any agent run   → the loop controller advances every item (ai-loop, mode=advance)
# Worker and loop logic live in the AI Org repo; this file only calls them.
name: AI agents

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or PR number (0 = none)
        required: true
        default: "0"
      mode:
        description: "agent (default) | advance | next"
        required: false
        default: agent
  schedule:
    - cron: "17 * * * *"

# Workflow permissions required by the autonomous AI Org worker and loop controller. No paid-model credentials are delegated.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  statuses: write

jobs:
  agent:
    # Autonomous execution is enabled for routed ai:* work; the free-only worker enforces provider policy.
    if: >-
      (
        (github.event_name == 'workflow_dispatch' && (inputs.mode == '' || inputs.mode == 'agent') && inputs.number != '0') ||
        ((github.event_name == 'issues' || github.event_name == 'pull_request') && startsWith(github.event.label.name, 'ai:'))
      )
    uses: appsworld2027/parent-plus-ai-org/.github/workflows/agent-worker.yml@139db9390b3c4188708090f44cdf62dda7a86698
    with:
      number: ${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
      handbook_ref: 139db9390b3c4188708090f44cdf62dda7a86698
    # Founder policy: do not expose paid-model credentials to background workers.
    # The canonical router is Groq free-tier only; no paid model credentials are delegated.
    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  resume:
    # Resume eligible free-model tasks on the hourly schedule.
    if: github.event_name == 'schedule'
    uses: appsworld2027/parent-plus-ai-org/.github/workflows/agent-resume.yml@139db9390b3c4188708090f44cdf62dda7a86698
    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  loop-advance:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'advance')
    uses: appsworld2027/parent-plus-ai-org/.github/workflows/ai-loop.yml@139db9390b3c4188708090f44cdf62dda7a86698
    with:
      mode: advance
      handbook_ref: 139db9390b3c4188708090f44cdf62dda7a86698
  loop-next:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'next'
    uses: appsworld2027/parent-plus-ai-org/.github/workflows/ai-loop.yml@139db9390b3c4188708090f44cdf62dda7a86698
    with:
      mode: next
      handbook_ref: 139db9390b3c4188708090f44cdf62dda7a86698
  loop-command:
    if: >-
      github.event_name == 'issue_comment' &&
      (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/changes') ||
       startsWith(github.event.comment.body, '/next') || startsWith(github.event.comment.body, '/stop'))
    uses: appsworld2027/parent-plus-ai-org/.github/workflows/ai-loop.yml@139db9390b3c4188708090f44cdf62dda7a86698
    with:
      mode: command
      handbook_ref: 139db9390b3c4188708090f44cdf62dda7a86698
      comment_id: ${{ format('{0}', github.event.comment.id) }}
